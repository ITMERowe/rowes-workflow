<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" role="img" aria-labelledby="t d">
<title id="t">auto-route against plain Claude Code on the same build</title>
<desc id="d">Cost per build: $1.11 plain, $0.89 with auto-route, 20% less. Tokens read from cache: 3.0 million plain, 2.0 million with auto-route, a third fewer. Runs that delegated the reading: 2 of 4 with a prompt rule, 3 of 3 with the enforcing hook.</desc>
<style>
.bg{fill:#fcfcfb;stroke:#dcdbd5}.big{fill:#0b0b0b;font:700 32px system-ui,-apple-system,Segoe UI,sans-serif}
.cap{fill:#52514e;font:14px system-ui,-apple-system,Segoe UI,sans-serif}.val{fill:#0b0b0b;font:600 14px system-ui,-apple-system,Segoe UI,sans-serif}
.lab{fill:#52514e;font:12px system-ui,-apple-system,Segoe UI,sans-serif}.head{fill:#52514e;font:600 12px system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:.06em}
.ref{fill:#7d7c76}.acc{fill:#2a78d6}.axis{stroke:#c9c8c1;stroke-width:1}
@media (prefers-color-scheme:dark){.bg{fill:#1a1a19;stroke:#33332f}.big,.val{fill:#f0efec}.cap,.lab,.head{fill:#c3c2b7}.ref{fill:#8f8e88}.acc{fill:#3987e5}.axis{stroke:#4a4a45}}
</style>
<rect x=".5" y=".5" width="879" height="339" rx="12" class="bg"/>
<text x="32" y="38" class="head">SAME BUILD, SAME MODEL · gray = plain Claude Code or prompt rule · blue = auto-route</text>
<text x="32" y="84" class="big">−20%</text><text x="32" y="108" class="cap">cost per build</text><path d="M58,276 L58,161.6 Q58,157.6 62,157.6 L118,157.6 Q122,157.6 122,161.6 L122,276 Z" class="ref"/><text x="90" y="149.6" class="val" text-anchor="middle">$1.11</text><text x="90" y="298" class="lab" text-anchor="middle">Plain Claude Code</text><path d="M158,276 L158,185.07 Q158,181.07 162,181.07 L218,181.07 Q222,181.07 222,185.07 L222,276 Z" class="acc"/><text x="190" y="173.07" class="val" text-anchor="middle">$0.89</text><text x="190" y="298" class="lab" text-anchor="middle">auto-route</text><line x1="32" y1="276" x2="272" y2="276" class="axis"/><text x="320" y="84" class="big">−33%</text><text x="320" y="108" class="cap">tokens read from cache</text><path d="M346,276 L346,160 Q346,156 350,156 L406,156 Q410,156 410,160 L410,276 Z" class="ref"/><text x="378" y="148" class="val" text-anchor="middle">3.0M</text><text x="378" y="298" class="lab" text-anchor="middle">Plain Claude Code</text><path d="M446,276 L446,200 Q446,196 450,196 L506,196 Q510,196 510,200 L510,276 Z" class="acc"/><text x="478" y="188" class="val" text-anchor="middle">2.0M</text><text x="478" y="298" class="lab" text-anchor="middle">auto-route</text><line x1="320" y1="276" x2="560" y2="276" class="axis"/><text x="608" y="84" class="big">3 of 3</text><text x="608" y="108" class="cap">runs that delegated reading</text><path d="M634,276 L634,216 Q634,212 638,212 L694,212 Q698,212 698,216 L698,276 Z" class="ref"/><text x="666" y="204" class="val" text-anchor="middle">2 of 4</text><text x="666" y="298" class="lab" text-anchor="middle">Prompt rule</text><path d="M734,276 L734,152 Q734,148 738,148 L794,148 Q798,148 798,152 L798,276 Z" class="acc"/><text x="766" y="140" class="val" text-anchor="middle">3 of 3</text><text x="766" y="298" class="lab" text-anchor="middle">With the hook</text><line x1="608" y1="276" x2="848" y2="276" class="axis"/>
</svg>
